name: 🐞 Bug report
description: Report reproducible behavior in @alpacahq/alpaca-trade-api
title: "[Bug]: "
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Report SDK behavior here in English. Bugs in the Alpaca API itself, its OpenAPI specs, or its documentation go to [alpacahq/alpaca-api](https://github.com/alpacahq/alpaca-api/issues/new/choose). API feature requests, general questions, and dashboard bugs go to the [Community Forum](https://forum.alpaca.markets/) or [Slack](https://alpaca.markets/slack). Questions about your account, funding, or orders go to a [support request](https://alpaca.markets/support/request). Service status and incident updates are on the [status page](https://status.alpaca.markets/).

        Do not disclose suspected security vulnerabilities publicly. Follow the private reporting process in our [Security Policy](https://github.com/alpacahq/alpaca-trade-api-js/blob/master/SECURITY.md).

        Never include API keys, account details, or other secrets.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and tested the latest applicable SDK release.
          required: true
        - label: This report concerns SDK behavior. Bugs in the Alpaca API, its OpenAPI specs, or docs.alpaca.markets go to alpacahq/alpaca-api.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: SDK area
      description: Which SDK surface is affected?
      options:
        - Trading REST
        - Market Data REST
        - Trading WebSocket stream
        - Market Data WebSocket stream
        - Packaging or runtime compatibility
        - Documentation or examples
        - Other
    validations:
      required: true

  - type: input
    id: sdk_version
    attributes:
      label: SDK version
      description: Provide the exact installed version.
      placeholder: "@alpacahq/alpaca-trade-api 4.x.x"
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime, OS, and architecture
      description: Include runtime version, operating system, and CPU architecture because module loading, networking, and WebSocket behavior can differ.
      placeholder: Node.js 24.22.1 on macOS 26 arm64, Bun 1.x on Linux x64, or Cloudflare Workers
    validations:
      required: true

  - type: input
    id: module_entrypoint
    attributes:
      label: Module system and entrypoint
      description: State how the SDK is loaded.
      placeholder: ESM root import, CommonJS require, or @alpacahq/alpaca-trade-api/rest

  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior
      description: Describe what happens, including safe error output.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest runnable example and exact steps.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add sanitized logs or other non-sensitive context. Do not post request IDs, trace IDs, account identifiers, or private diagnostics; share those privately through a [support request](https://alpaca.markets/support/request) or the [Security Policy](https://github.com/alpacahq/alpaca-trade-api-js/blob/master/SECURITY.md) when appropriate.

  - type: checkboxes
    id: sensitive_data
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed API keys, credentials, account details, request or trace IDs, and other sensitive information.
          required: true
