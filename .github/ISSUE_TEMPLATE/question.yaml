name: ❓ Question about the SDK
description: Ask about @alpacahq/alpaca-trade-api after checking the documentation
title: "[Question]: "
labels: [question]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Ask SDK-specific questions here in English. For private account help, contact [Alpaca Support](https://alpaca.markets/support). For API behavior or feature requests, use the [Alpaca API issue tracker](https://github.com/alpacahq/Alpaca-API/issues/new/choose). For general API or platform discussion, use the [Alpaca Community Forum](https://forum.alpaca.markets/).

        Never include API keys, account details, or other secrets.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched the documentation and existing issues.
          required: true
        - label: My question is specific to the JavaScript/TypeScript SDK.
          required: true
        - label: My question is not asking for a trading strategy, algorithm design, or investment advice.
          required: true

  - type: input
    id: sdk_version
    attributes:
      label: SDK version
      description: Provide the installed version when the question concerns observed behavior.
      placeholder: "@alpacahq/alpaca-trade-api 4.x.x, or Not applicable"

  - type: input
    id: runtime
    attributes:
      label: Runtime context
      description: Include runtime, version, OS, architecture, module system, and entrypoint when relevant.
      placeholder: Node.js 24 on macOS arm64 with ESM root import, or Not applicable

  - type: textarea
    id: question
    attributes:
      label: Question
      description: Explain what you are trying to accomplish and what you already tried.
    validations:
      required: true

  - type: checkboxes
    id: sensitive_data
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed API keys, credentials, account details, and other secrets.
          required: true
